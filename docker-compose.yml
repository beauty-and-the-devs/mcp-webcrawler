version: '3.8'

services:
  webcrawler-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webcrawler-mcp
    restart: unless-stopped

    # Environment variables
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - BROWSER_HEADLESS=true
      - BROWSER_POOL_SIZE=2
      - RATE_LIMIT_REQUESTS_PER_MINUTE=30
      - MAX_CONCURRENT_CRAWLS=3

    # Resource limits for stability
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Shared memory for Chromium (required for Playwright)
    shm_size: '2gb'

    # Security options
    security_opt:
      - no-new-privileges:true

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # For MCP stdio transport, use stdin_open and tty
    stdin_open: true
    tty: true

  # Optional: HTTP wrapper for REST API access
  webcrawler-http:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: webcrawler-http
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - BROWSER_HEADLESS=true
      - BROWSER_POOL_SIZE=3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    shm_size: '2gb'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - http  # Only start with: docker compose --profile http up
