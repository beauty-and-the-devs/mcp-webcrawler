name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to VM after build'
        required: false
        default: 'true'
        type: boolean

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ==========================================================================
  # Build and Push Docker Image
  # ==========================================================================
  docker:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/webcrawler-mcp
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to VM
  # ==========================================================================
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: docker
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              echo 'Deploying new image...'

              # Configure Docker auth
              sudo gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

              # Pull new image
              sudo docker pull ${{ secrets.GCP_ARTIFACT_REGISTRY }}/webcrawler-mcp:latest

              # Stop and remove existing container
              sudo docker stop webcrawler-mcp 2>/dev/null || true
              sudo docker rm webcrawler-mcp 2>/dev/null || true

              # Run new container
              sudo docker run -d \
                --name webcrawler-mcp \
                --restart unless-stopped \
                --shm-size=2gb \
                --env-file /opt/webcrawler-mcp/.env \
                -p 3000:3000 \
                ${{ secrets.GCP_ARTIFACT_REGISTRY }}/webcrawler-mcp:latest

              echo 'Deployment complete!'
              sudo docker ps
            "

      - name: Health Check
        run: |
          echo "Waiting for service to start..."
          sleep 10

          # Get external IP
          EXTERNAL_IP=$(gcloud compute instances describe ${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "Checking health at http://$EXTERNAL_IP:3000/health"
          curl -f "http://$EXTERNAL_IP:3000/health" || echo "Health check skipped (may not be exposed)"
