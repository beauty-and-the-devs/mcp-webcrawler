version: "2026-01-02"
page_type: product_pdp

selectors:
  # Product ID from URL
  product_id:
    source: url
    pattern: '/product/(\d+)'

  # Product name - TikTok uses title-xxx pattern with hash suffix
  product_name:
    source: dom
    selectors:
      - 'h1[class*="title-"]'
      - '[class*="pdpTitle"]'
      - '[class*="productTitle"]'
      - '[class*="ProductTitle"]'
      - '[class*="goodsTitle"]'
      - '[class*="GoodsTitle"]'
      - '[data-e2e="product-title"]'
      - 'h1'

  # Description
  description:
    source: dom
    selectors:
      - '[class*="description-"]'
      - '[class*="productDesc"]'
      - '[class*="ProductDesc"]'
      - '[class*="goodsDesc"]'
      - '[class*="descContent"]'
      - '[data-e2e="product-description"]'
    fallback: null

  # Price information - TikTok uses price-xxx pattern
  price:
    sale_price:
      source: dom
      selectors:
        - '[class*="price-"] span:first-child'
        - '[class*="salePrice"]'
        - '[class*="currentPrice"]'
        - '[class*="priceNow"]'
        - '[class*="Price"] span'
        - '[data-e2e="price-current"]'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price

    list_price:
      source: dom
      selectors:
        - '[class*="originalPrice"]'
        - '[class*="listPrice"]'
        - '[class*="priceOriginal"]'
        - 'del'
        - 's'
        - '[data-e2e="price-original"]'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
      fallback: null

    discount_rate:
      source: dom
      selectors:
        - '[class*="discount-"]'
        - '[class*="discountBadge"]'
        - '[class*="discountTag"]'
        - '[class*="saveBadge"]'
        - '[data-e2e="discount"]'
      pattern: '(\d+)%'
      transform: parse_int
      fallback: null

  # Rating and reviews - TikTok uses infoRatingScore-xxx pattern
  rating:
    source: dom
    selectors:
      - '[class*="infoRatingScore"]'
      - '[class*="ratingScore"]'
      - '[class*="RatingScore"]'
      - '[class*="starRating"]'
      - '[data-e2e="rating-score"]'
    pattern: '([\d.]+)'
    transform: parse_float
    fallback: 0

  review_count:
    source: dom
    selectors:
      - '[class*="infoRatingCount"]'
      - '[class*="reviewCount"]'
      - '[class*="RatingCount"]'
      - '[class*="ratingCount"]'
      - 'a[href*="reviews"]'
      - '[data-e2e="review-count"]'
    pattern: '\(?([\d,]+)\)?'
    transform: parse_int
    fallback: 0

  # Sold count - TikTok uses info__sold-xxx pattern
  sold_count:
    source: dom
    selectors:
      - '[class*="info__sold"]'
      - '[class*="soldCount"]'
      - '[class*="SoldCount"]'
      - '[class*="salesInfo"]'
      - '[data-e2e="sold-count"]'
    pattern: '([\d,.]+[KkMm]?)\s*sold'
    transform: parse_count
    fallback: null

  # Product options
  options_container:
    source: dom
    selectors:
      - '[class*="productOptions"]'
      - '[class*="variantSelector"]'
      - '[class*="skuSelector"]'
      - '[class*="optionWrapper"]'
      - '[data-e2e="product-options"]'

  option_item:
    source: dom
    selectors:
      - '[class*="optionItem"]'
      - '[class*="variantItem"]'
      - '[class*="skuItem"]'
      - '[data-e2e="option-item"]'

  option_name:
    source: dom
    selectors:
      - '[class*="optionName"]'
      - '[class*="optionLabel"]'
      - '[class*="variantLabel"]'
      - '[class*="skuLabel"]'
      - '[data-e2e="option-name"]'

  option_values:
    source: dom
    selectors:
      - '[class*="optionValue"]'
      - '[class*="variantValue"]'
      - '[class*="skuValue"]'
      - '[data-e2e="option-value"]'

  # Images - TikTok uses slick-list for image carousel
  main_image:
    source: dom
    selectors:
      - '.slick-current img'
      - '[class*="mainImage"] img'
      - '[class*="productImage"] img'
      - '[class*="galleryMain"] img'
      - '[data-e2e="main-image"] img'
      - 'img[class*="pdpImage"]'
    attribute: src

  gallery_images:
    source: dom
    selectors:
      - '.slick-list img'
      - '[class*="thumbnailList"] img'
      - '[class*="galleryThumbnail"] img'
      - '[class*="productGallery"] img'
      - '[data-e2e="gallery-image"] img'
    attribute: src
    multiple: true

  # Video
  video_url:
    source: dom
    selectors:
      - '[class*="productVideo"] video'
      - '[class*="videoPlayer"] video'
      - 'video[src]'
      - '[data-e2e="product-video"] video'
    attribute: src
    fallback: null

  # Shop information - TikTok uses shopName-xxx pattern
  shop:
    shop_id:
      source: dom
      selectors:
        - 'a[href*="/@"]'
        - 'a[href*="/shop/"]'
      pattern: '/@([^/]+)|/shop/(\d+)'
      attribute: href
      fallback: null

    shop_name:
      source: dom
      selectors:
        - '[class*="shopName"]'
        - '[class*="sellerName"]'
        - '[class*="ShopName"]'
        - '[class*="storeName"]'
        - '[data-e2e="shop-name"]'

    shop_url:
      source: dom
      selectors:
        - 'a[href*="/@"]'
        - 'a[href*="/shop/"]'
        - '[class*="shopLink"]'
      attribute: href
      fallback: null

    shop_rating:
      source: dom
      selectors:
        - '[class*="shopRating"]'
        - '[class*="sellerRating"]'
        - '[data-e2e="shop-rating"]'
      pattern: '([\d.]+)'
      transform: parse_float
      fallback: null

    follower_count:
      source: dom
      selectors:
        - '[class*="shopFollowers"]'
        - '[class*="followerCount"]'
        - '[data-e2e="shop-followers"]'
      pattern: '([\d,.]+[KkMm]?)'
      transform: parse_count
      fallback: null

  # Shipping
  shipping:
    free_shipping:
      source: dom
      selectors:
        - '[class*="freeShipping"]'
        - '[class*="free-shipping"]'
        - '[class*="shippingFree"]'
        - '[data-e2e="free-shipping"]'
      transform: boolean_exists
      fallback: false

    estimated_days:
      source: dom
      selectors:
        - '[class*="deliveryEstimate"]'
        - '[class*="shippingDays"]'
        - '[class*="arrivalDate"]'
        - '[data-e2e="delivery-estimate"]'
      pattern: '(\d+)'
      transform: parse_int
      fallback: null

  # Category breadcrumb
  category_path:
    source: dom
    selectors:
      - '[class*="breadcrumb"]'
      - '[class*="Breadcrumb"]'
      - 'nav[aria-label="breadcrumb"]'
      - '[class*="categoryPath"]'
    transform: parse_breadcrumb

  # Sell info container (contains rating, reviews, sold)
  sell_info:
    source: dom
    selectors:
      - '[class*="sellInfo"]'
      - '[class*="SellInfo"]'
      - '[class*="productInfo"]'
      - '[class*="ratingWrapper"]'

transforms:
  parse_price:
    type: regex
    pattern: '[\$]?([\d,]+\.?\d*)'
    output: float

  parse_count:
    type: custom
    description: "Parse count with K/M suffix"

  parse_float:
    type: regex
    pattern: '([\d.]+)'
    output: float

  parse_int:
    type: regex
    pattern: '([\d,]+)'
    output: integer

  boolean_exists:
    type: custom
    description: "Returns true if element exists"

  parse_breadcrumb:
    type: custom
    description: "Split breadcrumb into array"
