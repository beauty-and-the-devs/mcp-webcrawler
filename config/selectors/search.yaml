version: "2025-12-28"
page_type: search_result

selectors:
  # Search results container
  results_container:
    source: dom
    selectors:
      - '[data-testid="search-results"]'
      - '.search-results'
      - '[class*="SearchResult"]'

  # Individual result items
  result_item:
    source: dom
    selectors:
      - '[data-testid="search-result-item"]'
      - '.search-result-item'
      - '.product-card'
      - '[class*="ProductCard"]'

  # Product ID
  product_id:
    source: dom
    selectors:
      - 'a[href*="/product/"]'
    pattern: '/product/(\d+)'
    attribute: href

  # Product name
  product_name:
    source: dom
    selectors:
      - '[data-testid="product-title"]'
      - '.product-name'
      - '.product-title'
      - 'h3'
    fallback: null

  # Price
  price:
    min:
      source: dom
      selectors:
        - '[data-testid="price"]'
        - '.sale-price'
        - '.current-price'
        - '.price'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
    max:
      source: dom
      selectors:
        - '.original-price'
        - '.list-price'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
      fallback: null

  # Rating
  rating:
    source: dom
    selectors:
      - '[data-testid="rating"]'
      - '.rating-score'
      - '.rating'
    pattern: '([\d.]+)'
    transform: parse_float
    fallback: 0

  # Review count
  review_count:
    source: dom
    selectors:
      - '[data-testid="review-count"]'
      - '.review-count'
    pattern: '([\d,]+)'
    transform: parse_int
    fallback: 0

  # Sold count
  sold_count:
    source: dom
    selectors:
      - '[data-testid="sold-count"]'
      - '.sold-count'
    pattern: '([\d,.]+[KkMm]?)\s*sold'
    transform: parse_count
    fallback: null

  # Shop name
  shop_name:
    source: dom
    selectors:
      - '[data-testid="shop-name"]'
      - '.shop-name'
      - '.seller-name'
    fallback: null

  # Advertisement indicator
  is_ad:
    source: dom
    selectors:
      - '[data-testid="ad-badge"]'
      - '.ad-badge'
      - '.sponsored'
      - '[class*="sponsored"]'
    transform: boolean_exists
    fallback: false

  # Pagination
  next_page:
    source: dom
    selectors:
      - '[data-testid="next-page"]'
      - '.pagination-next'
      - 'a[rel="next"]'
    attribute: href
    fallback: null

  total_results:
    source: dom
    selectors:
      - '[data-testid="total-results"]'
      - '.total-results'
      - '.result-count'
    pattern: '([\d,]+)'
    transform: parse_int
    fallback: null

transforms:
  parse_price:
    type: regex
    pattern: '[\$]?([\d,]+\.?\d*)'
    output: float

  parse_count:
    type: custom
    description: "Parse count with K/M suffix"

  parse_float:
    type: regex
    pattern: '([\d.]+)'
    output: float

  parse_int:
    type: regex
    pattern: '([\d,]+)'
    output: integer

  boolean_exists:
    type: custom
    description: "Returns true if element exists"
