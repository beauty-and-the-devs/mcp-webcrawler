version: "2026-01-02"
page_type: search_result

selectors:
  # Search results container - TikTok uses dynamic class names with hash suffixes
  results_container:
    source: dom
    selectors:
      - '[class*="SearchResultList"]'
      - '[class*="searchResult"]'
      - '[class*="ProductList"]'
      - '[class*="product-list"]'
      - 'main [class*="container"]'
      - '#main-content-product_search'

  # Individual result items - product cards
  result_item:
    source: dom
    selectors:
      - '[class*="ProductCard"]'
      - '[class*="productCard"]'
      - '[class*="product-card"]'
      - '[class*="SearchResultCard"]'
      - '[class*="GoodsCard"]'
      - '[data-e2e="search-card"]'
      - 'a[href*="/product/"]'

  # Product ID
  product_id:
    source: dom
    selectors:
      - 'a[href*="/product/"]'
    pattern: '/product/(\d+)'
    attribute: href

  # Product name - TikTok uses title-xxx pattern
  product_name:
    source: dom
    selectors:
      - '[class*="title-"]'
      - '[class*="productTitle"]'
      - '[class*="product-title"]'
      - '[class*="ProductTitle"]'
      - '[class*="goodsName"]'
      - '[class*="GoodsName"]'
      - '[class*="name-"]'
      - 'h3'
      - 'h2'
      - '[data-e2e="product-title"]'
    fallback: null

  # Price - TikTok uses price-xxx pattern
  price:
    min:
      source: dom
      selectors:
        - '[class*="price-"] span'
        - '[class*="Price"] span'
        - '[class*="salePrice"]'
        - '[class*="sale-price"]'
        - '[class*="currentPrice"]'
        - '[class*="current-price"]'
        - '[class*="priceWrapper"] span'
        - '[data-e2e="price"]'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
    max:
      source: dom
      selectors:
        - '[class*="originalPrice"]'
        - '[class*="original-price"]'
        - '[class*="listPrice"]'
        - '[class*="list-price"]'
        - 'del'
        - 's'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
      fallback: null

  # Rating - TikTok uses infoRatingScore-xxx pattern
  rating:
    source: dom
    selectors:
      - '[class*="infoRatingScore"]'
      - '[class*="RatingScore"]'
      - '[class*="rating-score"]'
      - '[class*="ratingScore"]'
      - '[class*="star-rating"]'
      - '[class*="Rating"] span'
      - '[data-e2e="rating"]'
    pattern: '([\d.]+)'
    transform: parse_float
    fallback: 0

  # Review count - TikTok uses infoRatingCount-xxx pattern
  review_count:
    source: dom
    selectors:
      - '[class*="infoRatingCount"]'
      - '[class*="RatingCount"]'
      - '[class*="reviewCount"]'
      - '[class*="review-count"]'
      - '[class*="ratingCount"]'
      - '[data-e2e="review-count"]'
    pattern: '\(?([\d,]+)\)?'
    transform: parse_int
    fallback: 0

  # Sold count - TikTok uses info__sold-xxx or soldCount-xxx pattern
  sold_count:
    source: dom
    selectors:
      - '[class*="info__sold"]'
      - '[class*="soldCount"]'
      - '[class*="sold-count"]'
      - '[class*="SoldCount"]'
      - '[class*="salesVolume"]'
      - '[data-e2e="sold-count"]'
    pattern: '([\d,.]+[KkMm]?)\s*sold'
    transform: parse_count
    fallback: null

  # Shop name - TikTok uses shopName-xxx pattern
  shop_name:
    source: dom
    selectors:
      - '[class*="shopName"]'
      - '[class*="shop-name"]'
      - '[class*="ShopName"]'
      - '[class*="sellerName"]'
      - '[class*="seller-name"]'
      - '[data-e2e="shop-name"]'
    fallback: null

  # Advertisement indicator
  is_ad:
    source: dom
    selectors:
      - '[class*="adBadge"]'
      - '[class*="ad-badge"]'
      - '[class*="sponsored"]'
      - '[class*="Sponsored"]'
      - '[data-e2e="ad-badge"]'
    transform: boolean_exists
    fallback: false

  # Pagination
  next_page:
    source: dom
    selectors:
      - '[class*="pagination"] a[aria-label="next"]'
      - '[class*="Pagination"] button:last-child'
      - 'button[aria-label="Next page"]'
      - 'a[rel="next"]'
    attribute: href
    fallback: null

  total_results:
    source: dom
    selectors:
      - '[class*="totalResults"]'
      - '[class*="total-results"]'
      - '[class*="resultCount"]'
      - '[class*="result-count"]'
    pattern: '([\d,]+)'
    transform: parse_int
    fallback: null

transforms:
  parse_price:
    type: regex
    pattern: '[\$]?([\d,]+\.?\d*)'
    output: float

  parse_count:
    type: custom
    description: "Parse count with K/M suffix"

  parse_float:
    type: regex
    pattern: '([\d.]+)'
    output: float

  parse_int:
    type: regex
    pattern: '([\d,]+)'
    output: integer

  boolean_exists:
    type: custom
    description: "Returns true if element exists"
