version: "2026-01-02"
page_type: category_rank

selectors:
  # Product list container - TikTok uses dynamic class names
  product_list:
    source: dom
    selectors:
      - '[class*="ProductList"]'
      - '[class*="productList"]'
      - '[class*="product-list"]'
      - '[class*="categoryProducts"]'
      - '[class*="goodsList"]'
      - '[class*="GoodsList"]'
      - 'main [class*="container"]'
      - '#main-content-product_category'

  # Individual product items
  product_item:
    source: dom
    selectors:
      - '[class*="ProductCard"]'
      - '[class*="productCard"]'
      - '[class*="product-card"]'
      - '[class*="GoodsCard"]'
      - '[class*="goodsCard"]'
      - '[data-e2e="product-card"]'
      - 'a[href*="/product/"]'

  # Product ID from link
  product_id:
    source: dom
    selectors:
      - 'a[href*="/product/"]'
    pattern: '/product/(\d+)'
    attribute: href

  # Product name - TikTok uses title-xxx pattern
  product_name:
    source: dom
    selectors:
      - '[class*="title-"]'
      - '[class*="productTitle"]'
      - '[class*="ProductTitle"]'
      - '[class*="goodsName"]'
      - '[class*="GoodsName"]'
      - '[class*="name-"]'
      - '[data-e2e="product-title"]'
      - 'h3'
      - 'h4'
    fallback: null

  # Sales rank (position in list)
  sales_rank:
    source: position
    description: "Derived from DOM order (1-indexed)"

  # Unit sold - TikTok uses info__sold-xxx pattern
  unit_sold:
    source: dom
    selectors:
      - '[class*="info__sold"]'
      - '[class*="soldCount"]'
      - '[class*="SoldCount"]'
      - '[class*="salesVolume"]'
      - '[data-e2e="sold-count"]'
    pattern: '([\d,.]+[KkMm]?)\s*sold'
    transform: parse_count
    fallback: null

  # Price - TikTok uses price-xxx pattern
  price:
    min:
      source: dom
      selectors:
        - '[class*="price-"] span'
        - '[class*="Price"] span'
        - '[class*="salePrice"]'
        - '[class*="currentPrice"]'
        - '[class*="priceWrapper"] span'
        - '[data-e2e="price"]'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
    max:
      source: dom
      selectors:
        - '[class*="originalPrice"]'
        - '[class*="listPrice"]'
        - 'del'
        - 's'
      pattern: '[\$]?([\d,]+\.?\d*)'
      transform: parse_price
      fallback: null

  # Rating - TikTok uses infoRatingScore-xxx pattern
  rating:
    source: dom
    selectors:
      - '[class*="infoRatingScore"]'
      - '[class*="RatingScore"]'
      - '[class*="ratingScore"]'
      - '[class*="rating-"]'
      - '[class*="Rating"] span'
      - '[data-e2e="rating"]'
    pattern: '([\d.]+)'
    transform: parse_float
    fallback: 0

  # Review count - TikTok uses infoRatingCount-xxx pattern
  review_count:
    source: dom
    selectors:
      - '[class*="infoRatingCount"]'
      - '[class*="RatingCount"]'
      - '[class*="reviewCount"]'
      - '[class*="ratingCount"]'
      - '[data-e2e="review-count"]'
    pattern: '\(?([\d,]+)\)?'
    transform: parse_int
    fallback: 0

  # Shop info - TikTok uses shopName-xxx pattern
  shop_name:
    source: dom
    selectors:
      - '[class*="shopName"]'
      - '[class*="ShopName"]'
      - '[class*="sellerName"]'
      - '[class*="storeName"]'
      - '[data-e2e="shop-name"]'
    fallback: null

  shop_id:
    source: dom
    selectors:
      - 'a[href*="/@"]'
      - 'a[href*="/shop/"]'
    pattern: '/@([^/]+)|/shop/(\d+)'
    attribute: href
    fallback: null

  # Category path from breadcrumbs
  category_path:
    source: dom
    selectors:
      - '[class*="breadcrumb"]'
      - '[class*="Breadcrumb"]'
      - 'nav[aria-label="breadcrumb"]'
      - '[class*="categoryPath"]'
    transform: parse_breadcrumb

  # Sell info container
  sell_info:
    source: dom
    selectors:
      - '[class*="sellInfo"]'
      - '[class*="SellInfo"]'
      - '[class*="productMeta"]'

transforms:
  parse_price:
    type: regex
    pattern: '[\$]?([\d,]+\.?\d*)'
    output: float

  parse_count:
    type: custom
    description: "Parse count with K/M suffix (2.3K -> 2300)"

  parse_float:
    type: regex
    pattern: '([\d.]+)'
    output: float

  parse_int:
    type: regex
    pattern: '([\d,]+)'
    output: integer

  parse_breadcrumb:
    type: custom
    description: "Split breadcrumb into array"
